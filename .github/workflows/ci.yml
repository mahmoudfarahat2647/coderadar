name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  architecture:
    name: Architectural boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the Clean Architecture Dependency Rule
        run: bash scripts/check-architecture.sh

  security:
    name: Security posture (NFR-05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Guards path traversal, the strict CSP, the keychain storage and the
      # absence of shell injection (CR-SPEC-01 NFR-05).
      - name: Enforce the security posture
        run: bash scripts/check-security.sh

  rules-manifest:
    name: Rules manifest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate rules/manifest.json
        run: |
          python3 - <<'PY'
          import json, sys
          with open("rules/manifest.json", encoding="utf-8") as fh:
              data = json.load(fh)
          rules = data["rules"]
          assert data["total_rules"] == 19, data["total_rules"]
          assert len(rules) == 19, len(rules)
          ids = [r["id"] for r in rules]
          assert len(set(ids)) == 19, "duplicate rule ids"
          for r in rules:
              assert r["cwe"] is not None
              assert r["severity"] in {"LOW", "MEDIUM", "HIGH", "CRITICAL"}, r
          print("manifest OK:", len(rules), "rules")
          PY

  build-test-clippy:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: cargo build
        run: |
          cargo build --workspace --all-targets --verbose
          cargo build --manifest-path src-tauri/Cargo.toml --verbose
      - name: cargo test
        run: cargo test --workspace --all-targets --verbose
      # The desktop binary has `test = false`, so this is a compile check of the
      # IPC layer (commands, DTOs and the Tauri bridge).
      - name: cargo test (desktop crate)
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose
      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  msrv:
    name: MSRV build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Keep in sync with `rust-version` in the workspace Cargo.toml.
      # Verifies the core Clean Architecture crates (Layers 1-4) on the declared MSRV.
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the declared MSRV
        run: cargo check --workspace --all-targets

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check & build
        run: npm run build
      - name: Radar geometry tests
        run: npm run test:geometry
      - name: Trend geometry tests
        run: npm run test:trend

  performance:
    name: Performance budget (NFR-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The budgets (cold start < 1.2 s, idle RSS < 45 MB) are only meaningful
      # for an optimised build, so the suite runs in release mode.
      - name: cargo test (release, performance budget)
        run: cargo test --release -p coderadar-infrastructure --test performance_budget --test memory_budget --verbose

