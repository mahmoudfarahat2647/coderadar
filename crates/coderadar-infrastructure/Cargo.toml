[package]
name = "coderadar-infrastructure"
description = "CodeRadar Studio Layer 4 (Frameworks & Drivers): concrete adapters (Tauri/Tokio/Sqlx/Reqwest)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Layer 4 is the outermost circle: it may depend on every inner layer and on
# external drivers. Concrete implementations of the Layer 2 ports live here.
[dependencies]
coderadar-domain = { workspace = true }
coderadar-usecases = { workspace = true }
coderadar-adapters = { workspace = true }

# Parallel file walking that honours `.gitignore` (Phase 2 scanner).
# Pinned: ignore >= 0.4.24 requires Rust 1.85+ (edition2024), breaking the
# workspace MSRV job (rust-version = 1.82).
ignore = "=0.4.23"
# Glob matching for the `.coderadar.json` layer map. Pinned for the same MSRV
# reason (newer releases are edition2024).
globset = "=0.4.15"
# Tier 0 / Mock heuristic rules.
regex = "1"
# Tree-sitter chunker for TS/JS (Phase 2); grammars ship as separate crates.
# NOTE (MSRV 1.82): `tree-sitter-language` is pinned to 0.1.5 and `indexmap`
# to 2.7.1 in Cargo.lock — newer releases require Rust 1.85+ (edition2024).
# Re-run `cargo +1.82.0 check --workspace --all-targets` after any
# `cargo update`.
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 fingerprints for workspace files (Phase 6, CR-SPEC-13). Pure Rust,
# no external crypto dependency, and `sha2` 0.10 keeps `rust-version = 1.56`.
sha2 = "0.10"
# SQLite scan-history repository (Phase 6, CR-SPEC-13). The `bundled` feature
# compiles SQLite from the vendored C amalgamation, so no system SQLite is
# required on any platform. Pinned to the exact 0.32.1 release: 0.33 moved to
# a `libsqlite3-sys` that requires Rust 1.85+ (edition2024) and would break the
# workspace MSRV job (rust-version = 1.82).
rusqlite = { version = "=0.32.1", features = ["bundled"] }
# `libsqlite3-sys` is pinned as well because `rusqlite = "=0.32.1"` alone still
# allows the `0.30.x` line to float onto releases whose MSRV is above 1.82.
# `=0.30.1` is the last `libsqlite3-sys` release that still builds on Rust 1.82.
libsqlite3-sys = "=0.30.1"

# Jev Tier 1 semantic engine HTTP client (Phase 5, CR-SPEC-12).
# `blocking` keeps the std-future Layer 2 port runtime-free: the adapter calls
# the blocking client from its own synchronous future body. `http2` negotiates
# HTTP/2 and the shared `Client` owns the connection pool.
# TLS: `rustls-tls-native-roots` uses the pure-Rust `ring` provider and the OS
# certificate store. This deliberately avoids `default-tls` (native OpenSSL on
# Linux) and the `rustls-tls`/aws-lc stack, which pulls the optional HTTP/3
# `quinn` tree — both break the workspace MSRV job (rust-version = 1.82).
# reqwest is held on the 0.12 line: 0.13 declares rust-version = 1.85.
# Cargo.lock additionally pins `quinn`/`quinn-proto`, `hyper-util`,
# `hyper-rustls`, `tokio-util`, `idna_adapter` and `zeroize` to the newest
# releases that still compile on Rust 1.82 (see the MSRV job in CI).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "http2", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "windows")'.dependencies]
# OS keychain backend (Phase 5, CR-SPEC-12 §4). Per-target features avoid
# pulling a Linux system library into the Windows/macOS builds.
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `linux-native` uses the kernel keyring (pure Rust, no `libdbus`/`libsecret`
# system library), keeping CI builds dependency-free.
keyring = { version = "3.6.3", default-features = false, features = ["linux-native"] }

[dev-dependencies]
# Pinned: tempfile >= 3.15 pulls getrandom 0.4, which requires Rust 1.85+
# (edition2024) and would break the workspace MSRV job (rust-version = 1.82).
tempfile = "=3.14.0"
