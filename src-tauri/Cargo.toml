[package]
name = "coderadar-desktop"
description = "CodeRadar Studio Layer 4 (Frameworks & Drivers): Tauri 2.0 desktop shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "coderadar-desktop"
path = "src/main.rs"
test = false

[dependencies]
coderadar-domain = { workspace = true }
coderadar-adapters = { workspace = true }
coderadar-infrastructure = { workspace = true }
tauri = { version = "2.11.6", default-features = true }
tauri-plugin-dialog = { version = "2.7.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
