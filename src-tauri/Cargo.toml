[package]
name = "coderadar-desktop"
description = "CodeRadar Studio Layer 4 (Frameworks & Drivers): Tauri 2.0 desktop shell."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mahmoudfarahat2647/coderadar"
authors = ["CodeRadar Studio"]

[[bin]]
name = "coderadar-desktop"
path = "src/main.rs"
test = false

[dependencies]
coderadar-domain = { path = "../crates/coderadar-domain" }
coderadar-usecases = { path = "../crates/coderadar-usecases" }
coderadar-adapters = { path = "../crates/coderadar-adapters" }
coderadar-infrastructure = { path = "../crates/coderadar-infrastructure" }
tauri = { version = "2.11.6", default-features = true }
tauri-plugin-dialog = { version = "2.7.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[workspace]
